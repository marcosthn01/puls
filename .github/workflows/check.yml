name: Puls Selbsttest

# Öffnet die veröffentlichte App in einem Browser, entsperrt sie und klickt alles durch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Browser installieren
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: App testen
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node tests/live_check.mjs
