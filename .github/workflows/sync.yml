name: Puls Sync

# Holt deine Garmin-Daten, verschlüsselt sie und veröffentlicht die App auf GitHub Pages.
#
# Wann abgerufen wird:
# - Wenn du Puls öffnest (die App startet den Lauf selbst).
# - Morgens: alle 20 Min., bis deine Nacht da ist – dann Benachrichtigung und Schluss für den Morgen.
# - Mit Benachrichtigungen zusätzlich: mittags (Bewegung, Stress), nachmittags (Trainingsziel,
#   freitags Wochenziel, sonntags Wochenbericht), früher Abend (Schritte) und zur Schlafenszeit.
# - Wenn der iPhone-Kurzbefehl Walking-Pad-Schritte schickt (input "walk").
# Geplante Läufe ohne Anlass enden nach wenigen Sekunden, ohne Garmin zu fragen.
# Zeiten im Zeitplan sind UTC (Deutschland = UTC+1 im Winter, UTC+2 im Sommer).
on:
  schedule:
    - cron: "*/20 3-9 * * *"      # Morgen-Fenster
    - cron: "17,47 11 * * *"      # Mittag (Bewegung, Stress)
    - cron: "17 14,15 * * *"      # Nachmittag (Trainingsziel)
    - cron: "17,47 17-23 * * *"   # Abend (Schritte, Schlaf-Erinnerung)
  workflow_dispatch:
    inputs:
      mfa_code:
        description: "Garmin-Bestätigungscode (nur eintragen, wenn Garmin einen geschickt hat)"
        required: false
        default: ""
      full_refresh:
        description: "Alle Tage neu von Garmin laden"
        type: boolean
        default: false
      push_subscription:
        description: "Nur für die App: Abo für Benachrichtigungen"
        required: false
        default: ""
      walk:
        description: "Nur für den iPhone-Kurzbefehl: Walking-Pad-Schritte aus Apple Health"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "sync/**", ".github/workflows/sync.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: puls-sync
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sync: ${{ steps.plan.outputs.sync }}
    steps:
      - uses: actions/checkout@v7

      - name: Zwischenspeicher laden
        uses: actions/cache/restore@v6
        with:
          path: .puls-cache
          key: puls-plan-${{ github.run_id }}
          restore-keys: puls-

      - name: Planen
        id: plan
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          PULS_TIMEZONE: Europe/Berlin
        run: node sync/notify.mjs plan .puls-cache

      # GitHub pausiert geplante Läufe nach 60 Tagen ohne Repo-Aktivität – das verhindert es.
      - name: Zeitplan aktiv halten
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"

  sync:
    needs: plan
    # Von der App gestartet: sofort (ohne Planungsschritt). Geplant: nur wenn es einen Anlass gibt.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.plan.outputs.sync == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r sync/requirements.txt

      - name: Pages vorbereiten
        id: pages
        uses: actions/configure-pages@v6

      - name: Zwischenspeicher laden
        uses: actions/cache/restore@v6
        with:
          path: .puls-cache
          key: puls-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: puls-

      - name: Garmin-Daten holen
        id: sync
        continue-on-error: true
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          PULS_TIMEZONE: Europe/Berlin
        run: python sync/puls_sync.py --cache .puls-cache --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Benachrichtigungen
        continue-on-error: true
        env:
          DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
          PULS_TIMEZONE: Europe/Berlin
          PULS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm install --no-save --no-package-lock --silent web-push@3.6.7
          node sync/notify.mjs send .puls-cache

      - name: Zwischenspeicher sichern
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .puls-cache
          key: puls-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seite bauen
        run: |
          mkdir -p _site
          cp -r app/. _site/
          if [ -f .puls-cache/data.enc.json ]; then cp .puls-cache/data.enc.json _site/; fi
          if [ -f .puls-cache/push-public.json ]; then cp .puls-cache/push-public.json _site/push.json; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Veröffentlichen
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Ergebnis prüfen
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Der Garmin-Abruf hat nicht geklappt – Details im Schritt 'Garmin-Daten holen'. Die App zeigt weiter die letzten Daten."
          exit 1

  tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r sync/requirements.txt pytest
      - run: python -m pytest -q tests
      - run: npm install --no-save --no-package-lock --silent web-push@3.6.7
      - run: node --test tests/*.test.mjs
